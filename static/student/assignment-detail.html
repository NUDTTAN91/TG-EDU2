<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>TG-EDU2</title>
<link rel="icon" type="image/svg+xml" href="/TeamIco.svg">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/base.css">
<link rel="stylesheet" href="../assets/css/shared.css">
<link rel="stylesheet" href="../assets/css/dashboard-student.css">
</head>
<body>
<div class="app">
<aside class="sidebar" id="sidebar">
  <div class="sidebar-logo">
    <span class="icon-box" style="background:var(--yellow)"><i data-lucide="pen-tool"></i></span> 作业提交
  </div>
  <div class="sidebar-school" id="sidebar-school" style="padding-bottom:16px;border-bottom:2px solid #eee;margin-bottom:16px"></div>

  <a class="side-link" href="dashboard.html"><span class="ico"><i data-lucide="clipboard-list"></i></span> 作业面板</a>
  <a class="side-link active" href="courses.html"><span class="ico"><i data-lucide="book-open"></i></span> 我的作业</a>
  <a class="side-link" href="submissions.html"><span class="ico"><i data-lucide="upload"></i></span> 提交记录</a>
  <a class="side-link" href="grades.html"><span class="ico"><i data-lucide="trophy"></i></span> 成绩查看</a>
  <a class="side-link" href="#" onclick="alert('暂未开放');return false;"><span class="ico"><i data-lucide="message-circle"></i></span> 消息通知</a>

  <div class="sidebar-bottom">
    <div class="user-info">
      <div class="user-avatar" style="background:var(--yellow)"><i data-lucide="graduation-cap"></i></div>
      <div>
        <div class="user-name" id="sidebar-username"></div>
        <div class="user-role" id="sidebar-role"></div>
      </div>
    </div>
    <button class="logout-btn" onclick="Auth.logout()"><i data-lucide="log-out" style="width:16px;height:16px"></i> 退出登录</button>
  </div>
</aside>

<main class="main">
<button class="mobile-menu-btn" onclick="document.getElementById('sidebar').classList.toggle('open')">☰</button>

<!-- 面包屑导航 -->
<div class="detail-breadcrumb">
  <a href="courses.html"><i data-lucide="arrow-left" style="width:16px;height:16px"></i> 返回我的作业</a>
  <span class="detail-breadcrumb-sep">/</span>
  <span class="detail-breadcrumb-title" id="breadcrumb-title"></span>
</div>

<!-- 作业详情卡片 -->
<div class="detail-card" id="assignment-detail-card">
  <div style="padding:40px;text-align:center;color:#aaa">加载中...</div>
</div>

<!-- 提交区域（未提交且未过期时显示） -->
<div class="detail-card" id="submit-section" style="display:none">
  <div class="detail-card-header">
    <div class="detail-card-header-left">
      <i data-lucide="upload" style="width:16px;height:16px"></i> 提交作业
    </div>
  </div>
  <div class="detail-card-body">
    <label class="detail-upload-zone">
      <div class="upload-zone-icon"><i data-lucide="upload-cloud"></i></div>
      <p class="upload-zone-title">点击或拖拽文件到此处上传</p>
      <p class="upload-zone-hint" id="upload-hint">支持的文件格式加载中...</p>
      <input type="file" id="detail-file-input">
    </label>
    <button class="detail-submit-btn" id="detail-submit-btn"><i data-lucide="send" style="width:16px;height:16px"></i> 提交作业</button>
  </div>
</div>

<!-- 提交记录（已提交时显示） -->
<div class="detail-card" id="submission-record" style="display:none">
  <div class="detail-card-header">
    <div class="detail-card-header-left">
      <i data-lucide="check-circle" style="width:16px;height:16px"></i> 提交记录
    </div>
  </div>
  <div class="detail-record-body" id="submission-record-body">
    <!-- JS 动态填充 -->
  </div>
</div>
</main>
<div class="status-bar">Copyright © 2026 commit() · All Rights Reserved.</div>
</div>

<script src="../assets/js/lucide.js"></script>
<script src="../assets/js/shared.js"></script>
<script src="../assets/js/api.js"></script>
<script src="../assets/js/auth.js"></script>
<script src="assignment-detail.js"></script>
</body>
</html>
