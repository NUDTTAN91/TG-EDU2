<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>TG-EDU2 · 成绩查看</title>
<link rel="icon" type="image/svg+xml" href="/TeamIco.svg">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/base.css">
<link rel="stylesheet" href="../assets/css/shared.css">
<link rel="stylesheet" href="../assets/css/dashboard-student.css">
<style>
.stat-card{background:var(--card,#fff);border:var(--border);border-radius:var(--r,14px);padding:18px;box-shadow:var(--shadow-sm)}
.stat-card .stat-label{font-size:.75rem;color:#999;margin-bottom:6px}
.stat-card .stat-value{font-family:'JetBrains Mono',monospace;font-size:1.5rem;font-weight:800}
.stat-card .stat-sub{font-size:.68rem;color:#aaa;margin-top:4px}
[data-theme="dark"] .stat-card{background:var(--card,#252525)}
.grade-score{font-family:'JetBrains Mono',monospace;font-weight:700;font-size:.9rem}
.grade-high{color:#3fb950}
.grade-mid{color:#d2991b}
.grade-low{color:#f85149}
.grade-feedback{font-size:.78rem;color:#666;max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
[data-theme="dark"] .grade-feedback{color:var(--text-light)}
.pagination{display:flex;align-items:center;justify-content:center;gap:6px;margin-top:16px;padding:8px 0}
.pagination button{display:inline-flex;align-items:center;justify-content:center;min-width:32px;height:32px;padding:0 8px;border:var(--border);border-radius:var(--r,8px);background:var(--card,#fff);font-size:.78rem;font-weight:500;cursor:pointer;transition:all .12s}
.pagination button:hover:not(:disabled){border-color:var(--ink);background:var(--bg)}
.pagination button:disabled{opacity:.4;cursor:not-allowed}
.pagination button.active{background:var(--ink);color:#fff;border-color:var(--ink)}
.pagination .page-info{font-size:.72rem;color:#999;margin:0 8px}
[data-theme="dark"] .pagination button{background:var(--card,#252525)}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar" id="sidebar">
  <div class="sidebar-logo">
    <span class="icon-box" style="background:var(--yellow)"><i data-lucide="pen-tool"></i></span> 作业提交
  </div>
  <div class="sidebar-school" id="sidebar-school" style="padding-bottom:16px;border-bottom:2px solid #eee;margin-bottom:16px"></div>

  <a class="side-link" href="dashboard.html"><span class="ico"><i data-lucide="clipboard-list"></i></span> 作业面板</a>
  <a class="side-link" href="courses.html"><span class="ico"><i data-lucide="book-open"></i></span> 我的作业</a>
  <a class="side-link" href="submissions.html"><span class="ico"><i data-lucide="upload"></i></span> 提交记录</a>
  <a class="side-link active" href="grades.html"><span class="ico"><i data-lucide="trophy"></i></span> 成绩查看</a>
  <a class="side-link" href="#" onclick="alert('暂未开放');return false;"><span class="ico"><i data-lucide="message-circle"></i></span> 消息通知</a>

  <div class="sidebar-bottom">
    <div class="user-info">
      <div class="user-avatar" style="background:var(--yellow)"><i data-lucide="graduation-cap"></i></div>
      <div>
        <div class="user-name" id="sidebar-username"></div>
        <div class="user-role" id="sidebar-role"></div>
      </div>
    </div>
    <button class="logout-btn" onclick="Auth.logout()"><i data-lucide="log-out" style="width:16px;height:16px"></i> 退出登录</button>
  </div>
</aside>

<main class="main">
<button class="mobile-menu-btn" onclick="document.getElementById('sidebar').classList.toggle('open')">☰</button>
<div class="topbar"><h1><i data-lucide="trophy"></i> 成绩查看</h1></div>

<!-- 统计汇总卡片 -->
<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:20px" class="anim" id="stats-cards">
  <!-- JS 填充 -->
</div>

<!-- 筛选栏 -->
<div style="display:flex;gap:12px;margin-bottom:16px;flex-wrap:wrap">
  <select class="form-select" id="filter-course" style="width:160px">
    <option value="">全部课程</option>
  </select>
</div>

<!-- 成绩表格 -->
<div class="panel anim">
  <table class="data-table">
    <thead>
      <tr>
        <th>作业名称</th>
        <th>所属课程</th>
        <th>成绩</th>
        <th>教师评语</th>
        <th>批改时间</th>
      </tr>
    </thead>
    <tbody id="grades-tbody">
      <tr><td colspan="5" style="text-align:center;padding:40px;color:#999">加载中...</td></tr>
    </tbody>
  </table>
</div>

<!-- 分页 -->
<div class="pagination" id="pagination"></div>
</main>
<div class="status-bar">Copyright © 2026 commit() · All Rights Reserved.</div>
</div>

<script src="../assets/js/lucide.js"></script>
<script src="../assets/js/shared.js"></script>
<script src="../assets/js/api.js"></script>
<script src="../assets/js/auth.js"></script>
<script src="grades.js"></script>
</body>
</html>
