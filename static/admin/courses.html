<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>TG-EDU2 · 课程管理</title><link rel="icon" type="image/svg+xml" href="/TeamIco.svg"><link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/base.css">
<link rel="stylesheet" href="../assets/css/shared.css">
<style>
.tm-actions{display:flex;gap:12px;margin-bottom:16px;flex-wrap:wrap;align-items:center}
.tm-actions .form-select{width:160px}
.data-table{width:100%;border-collapse:collapse;font-size:.84rem}
.data-table th{text-align:left;padding:10px 12px;font-weight:700;border-bottom:3px solid var(--ink);color:var(--text-light,#666);font-size:.76rem;text-transform:uppercase}
.data-table td{padding:10px 12px;border-bottom:1px solid #eee}
[data-theme="dark"] .data-table td{border-bottom-color:#333}
.data-table tr:hover td{background:rgba(124,58,237,.04)}
.empty-msg{text-align:center;padding:40px;color:#999;font-size:.88rem}
.overlay{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.5);z-index:9999;align-items:center;justify-content:center}
.overlay.open{display:flex}
.modal-box{background:#fff;border:3px solid var(--ink);border-radius:14px;padding:28px 32px;min-width:420px;max-width:92vw;max-height:88vh;overflow-y:auto;box-shadow:6px 6px 0 var(--ink)}
[data-theme="dark"] .modal-box{background:#1e1e1e;box-shadow:6px 6px 0 #555;border-color:#555}
.modal-box h3{margin:0 0 20px;font-size:1.1rem}
.modal-box label{display:block;margin-bottom:4px;font-size:.85rem;font-weight:600;color:#555}
[data-theme="dark"] .modal-box label{color:#ccc}
.modal-box .form-input,.modal-box .form-select,.modal-box .form-textarea{width:100%;margin-bottom:14px}
.modal-error{display:none;color:#e74c3c;font-size:.85rem;margin-bottom:12px}
.modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:8px}
</style>
</head><body>
<div class="app">
<aside class="sidebar" id="sidebar">
<div class="sidebar-logo"><span class="icon-box" style="background:var(--pink)"><i data-lucide="pen-tool"></i></span> 作业提交</div>
<div class="sidebar-school">系统全局 · 所有院校</div>
<div class="sidebar-role"><span class="role-tag" style="background:var(--pink);color:#fff">超级管理员</span> 系统管理</div>
<div class="nav-section">平台管理</div>
<a class="side-link" href="dashboard.html"><span class="ico"><i data-lucide="bar-chart-3"></i></span> 控制台</a>
<a class="side-link" href="schools.html"><span class="ico"><i data-lucide="building-2"></i></span> 院校及班级管理</a>
<a class="side-link" href="users.html"><span class="ico"><i data-lucide="user"></i></span> 用户管理</a>
<a class="side-link active" href="courses.html"><span class="ico"><i data-lucide="book-open"></i></span> 课程管理</a>
<div class="nav-section">教学管理</div>
<a class="side-link" href="assignments.html"><span class="ico"><i data-lucide="pen-tool"></i></span> 作业管理</a>
<a class="side-link" href="submissions.html"><span class="ico"><i data-lucide="check-circle"></i></span> 批改作业</a>
<a class="side-link" href="scores.html"><span class="ico"><i data-lucide="clipboard-list"></i></span> 成绩管理</a>
<div class="nav-section">系统</div>
<a class="side-link" href="stats.html"><span class="ico"><i data-lucide="trending-up"></i></span> 数据统计</a>
<a class="side-link" href="settings.html"><span class="ico"><i data-lucide="wrench"></i></span> 系统设置</a>
<a class="side-link" href="logs.html"><span class="ico"><i data-lucide="clipboard-list"></i></span> 操作日志</a>
<div class="sidebar-bottom"><div class="user-info"><div class="user-avatar" style="background:var(--ink);color:#fff"><i data-lucide="shield"></i></div><div><div class="user-name" id="sidebar-username">管理员</div><div class="user-role" id="sidebar-role">超级管理员</div></div></div><button class="logout-btn" onclick="Auth.logout()"><i data-lucide="log-out" style="width:16px;height:16px"></i> 退出登录</button></div>
</aside>
<main class="main">
<button class="mobile-menu-btn" onclick="document.getElementById('sidebar').classList.toggle('open')">☰</button>
<div class="topbar"><h1><i data-lucide="book-open"></i> 课程管理</h1></div>

<div class="tm-actions">
  <select class="form-select" id="c-filter-school"><option value="">全部院校</option></select>
  <button class="btn btn-primary" onclick="openCourseModal()">+ 添加课程</button>
</div>
<div class="panel anim"><table class="data-table">
<thead><tr><th>课程名称</th><th>授课教师</th><th>所属院校</th><th>班级数</th><th>作业数</th><th>创建时间</th><th>操作</th></tr></thead>
<tbody id="courses-tbody"><tr><td colspan="7" class="empty-msg">加载中...</td></tr></tbody>
</table></div>

</main></div>

<!-- Modal: Course -->
<div class="overlay" id="course-overlay">
<div class="modal-box">
<h3 id="course-modal-title">添加课程</h3>
<label>课程名称</label><input class="form-input" id="cm-name" placeholder="请输入课程名称">
<label>所属学校</label><select class="form-select" id="cm-school"><option value="">请选择学校</option></select>
<label>授课教师</label><select class="form-select" id="cm-teacher"><option value="">请选择教师</option></select>
<div class="modal-error" id="cm-error"></div>
<div class="modal-actions"><button class="btn btn-secondary" onclick="closeModal('course-overlay')">取消</button><button class="btn btn-primary" id="cm-save" onclick="saveCourse()">提交</button></div>
</div></div>

<script src="../assets/js/lucide.js"></script>
<script src="../assets/js/shared.js"></script>
<script src="../assets/js/api.js"></script>
<script src="../assets/js/auth.js"></script>
<script src="courses.js"></script>
</body></html>
