<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>TG-EDU2</title>
<link rel="icon" type="image/svg+xml" href="/TeamIco.svg">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/base.css">
<link rel="stylesheet" href="../assets/css/shared.css">
<link rel="stylesheet" href="../assets/css/dashboard-admin.css">
</head>
<body>
<div class="app">
<aside class="sidebar" id="sidebar">
<div class="sidebar-logo"><span class="icon-box" style="background:var(--pink)"><i data-lucide="pen-tool"></i></span> 作业提交</div>
<div class="sidebar-school">系统全局 · 所有院校</div>
<div class="sidebar-role"><span class="role-tag" style="background:var(--pink);color:#fff">超级管理员</span> 系统管理</div>
<div class="nav-section">平台管理</div>
<a class="side-link active" href="dashboard.html"><span class="ico"><i data-lucide="bar-chart-3"></i></span> 控制台</a>
<a class="side-link" href="schools.html"><span class="ico"><i data-lucide="building-2"></i></span> 院校及班级管理</a>
<a class="side-link" href="users.html"><span class="ico"><i data-lucide="user"></i></span> 用户管理</a>
<a class="side-link" href="courses.html"><span class="ico"><i data-lucide="book-open"></i></span> 课程管理</a>
<div class="nav-section">教学管理</div>
<a class="side-link" href="assignments.html"><span class="ico"><i data-lucide="pen-tool"></i></span> 作业管理</a>
<a class="side-link" href="submissions.html"><span class="ico"><i data-lucide="check-circle"></i></span> 批改作业</a>
<a class="side-link" href="scores.html"><span class="ico"><i data-lucide="clipboard-list"></i></span> 成绩管理</a>
<div class="nav-section">系统</div>
<a class="side-link" href="stats.html"><span class="ico"><i data-lucide="trending-up"></i></span> 数据统计</a>
<a class="side-link" href="settings.html"><span class="ico"><i data-lucide="wrench"></i></span> 系统设置</a>
<a class="side-link" href="logs.html"><span class="ico"><i data-lucide="clipboard-list"></i></span> 操作日志</a>
<div class="sidebar-bottom">
<div class="user-info">
<div class="user-avatar" style="background:var(--lavender)"><i data-lucide="user"></i></div>
<div><div class="user-name" id="sidebar-username">管理员 001</div><div class="user-role" id="sidebar-role">平台管理</div></div>
</div>
<button class="logout-btn" onclick="Auth.logout()"><i data-lucide="log-out" style="width:16px;height:16px"></i> 退出登录</button>
</div>
</aside>
<main class="main">
<button class="mobile-menu-btn" onclick="document.getElementById('sidebar').classList.toggle('open')">☰</button>
<div class="topbar"><h1><i data-lucide="shield"></i> 系统总览</h1><div class="status-badge"><span class="pulse"></span> 系统运行正常</div></div>
<div class="overview anim">
<div class="ov-card"><div class="ov-label">入驻院校</div><div class="ov-val" data-stat="total_schools" style="color:var(--pink)">4</div><div class="ov-sub" id="sub-schools">1 所试运行中</div></div>
<div class="ov-card"><div class="ov-label">教师用户</div><div class="ov-val" data-stat="total_teachers" style="color:var(--yellow)">47</div><div class="ov-sub" id="sub-teachers">本月新增 3</div></div>
<div class="ov-card"><div class="ov-label">学生用户</div><div class="ov-val" data-stat="total_students" style="color:var(--sky)">5,220</div><div class="ov-sub" id="sub-students">活跃 3,840</div></div>
<div class="ov-card"><div class="ov-label">累计作业</div><div class="ov-val" data-stat="total_assignments" style="color:var(--lime)">186</div><div class="ov-sub" id="sub-assignments">本学期在授</div></div>
<div class="ov-card"><div class="ov-label">累计提交</div><div class="ov-val" data-stat="total_submissions" style="color:var(--lavender)">12,680</div><div class="ov-sub" id="sub-submissions">本周 +342</div></div>
</div>
<div class="two-col anim">
<div class="panel"><div class="panel-head"><h2><i data-lucide="building-2"></i> 院校列表</h2><button>+ 添加院校</button></div>
<div id="school-list-container"></div>
</div>
<div class="panel"><div class="panel-head"><h2><i data-lucide="clipboard-list"></i> 最近动态</h2></div>
<div id="activity-container"></div>
</div>
</div>
<div class="stats-grid anim">
<div class="stat-panel"><h3><i data-lucide="trending-up"></i> 本月各院校提交量</h3><div class="bar-chart" id="bar-chart-container"></div></div>
<div class="stat-panel"><h3><i data-lucide="bar-chart-3"></i> 用户角色分布</h3><div class="pie-row" id="pie-chart-container"></div></div>
</div>
<div class="health-section anim"><h2 style="font-weight:700;font-size:.88rem;margin-bottom:10px"><i data-lucide="settings"></i> 系统状态</h2><div class="health-grid">
<div class="health-card"><div class="health-icon"><i data-lucide="database"></i></div><div class="health-label">存储空间</div><div class="health-val" style="color:var(--lime)">62%</div><div class="health-bar"><div class="health-fill" style="width:62%;background:var(--lime)"></div></div></div>
<div class="health-card"><div class="health-icon"><i data-lucide="zap"></i></div><div class="health-label">服务器负载</div><div class="health-val" style="color:var(--sky)">23%</div><div class="health-bar"><div class="health-fill" style="width:23%;background:var(--sky)"></div></div></div>
<div class="health-card"><div class="health-icon"><i data-lucide="clock"></i></div><div class="health-label">运行时间</div><div class="health-val" style="color:var(--yellow)">99.9%</div><div class="health-bar"><div class="health-fill" style="width:99.9%;background:var(--yellow)"></div></div></div>
</div></div>
</main>
</div>
<script src="../assets/js/lucide.js"></script>
<script src="../assets/js/shared.js"></script>
<script src="../assets/js/api.js"></script>
<script src="../assets/js/auth.js"></script>
<script src="dashboard.js"></script>
</body>
</html>
