<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>TG-EDU2 · 批改作业</title><link rel="icon" type="image/svg+xml" href="/TeamIco.svg"><link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/base.css">
<link rel="stylesheet" href="../assets/css/shared.css">
<link rel="stylesheet" href="../assets/css/teacher-grade.css">
</head><body>
<div class="app">
<aside class="sidebar" id="sidebar">
<div class="sidebar-logo"><span class="icon-box" style="background:var(--pink)"><i data-lucide="pen-tool"></i></span> 作业提交</div>
<div class="sidebar-school">系统全局 · 所有院校</div>
<div class="sidebar-role"><span class="role-tag" style="background:var(--pink);color:#fff">超级管理员</span> 系统管理</div>
<div class="nav-section">平台管理</div>
<a class="side-link" href="dashboard.html"><span class="ico"><i data-lucide="bar-chart-3"></i></span> 控制台</a>
<a class="side-link" href="schools.html"><span class="ico"><i data-lucide="building-2"></i></span> 院校及班级管理</a>
<a class="side-link" href="users.html"><span class="ico"><i data-lucide="user"></i></span> 用户管理</a>
<a class="side-link" href="courses.html"><span class="ico"><i data-lucide="book-open"></i></span> 课程管理</a>
<div class="nav-section">教学管理</div>
<a class="side-link" href="assignments.html"><span class="ico"><i data-lucide="pen-tool"></i></span> 作业管理</a>
<a class="side-link active" href="submissions.html"><span class="ico"><i data-lucide="check-circle"></i></span> 批改作业</a>
<a class="side-link" href="scores.html"><span class="ico"><i data-lucide="clipboard-list"></i></span> 成绩管理</a>
<div class="nav-section">系统</div>
<a class="side-link" href="stats.html"><span class="ico"><i data-lucide="trending-up"></i></span> 数据统计</a>
<a class="side-link" href="settings.html"><span class="ico"><i data-lucide="wrench"></i></span> 系统设置</a>
<a class="side-link" href="logs.html"><span class="ico"><i data-lucide="clipboard-list"></i></span> 操作日志</a>
<div class="sidebar-bottom"><div class="user-info"><div class="user-avatar" style="background:var(--ink);color:#fff"><i data-lucide="shield"></i></div><div><div class="user-name" id="sidebar-username">管理员</div><div class="user-role" id="sidebar-role">超级管理员</div></div></div><button class="logout-btn" onclick="Auth.logout()"><i data-lucide="log-out" style="width:16px;height:16px"></i> 退出登录</button></div>
</aside>

<main class="main">
<button class="mobile-menu-btn" onclick="document.getElementById('sidebar').classList.toggle('open')">☰</button>
<div class="topbar"><h1><i data-lucide="check-circle"></i> 批改作业</h1></div>

<!-- Filter bar: school → course → assignment -->
<div class="filter-bar anim">
  <label>院校</label>
  <select class="filter-select" id="schoolFilter">
    <option value="all">全部院校</option>
  </select>
  <span class="filter-sep">›</span>
  <label>课程</label>
  <select class="filter-select" id="courseFilter">
    <option value="all">全部课程</option>
  </select>
  <span class="filter-sep">›</span>
  <label>作业</label>
  <select class="filter-select" id="assignFilter">
    <option value="all">全部作业</option>
  </select>
  <div class="filter-stats" id="filterStats">
    <div class="filter-stat"><span class="dot" style="background:var(--pink)"></span> 待批改 <strong id="stat-pending">0</strong></div>
    <div class="filter-stat"><span class="dot" style="background:var(--lime)"></span> 已批改 <strong id="stat-graded">0</strong></div>
    <div class="filter-stat">共 <strong id="stat-total">0</strong> 份</div>
  </div>
</div>

<div class="grade-layout anim">
  <!-- Student list -->
  <div class="student-list">
    <div class="student-head">
      <div class="student-head-top">
        <h3>提交列表</h3>
        <div class="progress-mini"><strong id="progress-graded">0</strong>/<span id="progress-total">0</span> 已批改</div>
      </div>
      <input class="student-search" id="studentSearch" placeholder="搜索学生…">
      <div class="filter-tabs">
        <button class="filter-tab active" onclick="filterStudents(this,'all')">全部</button>
        <button class="filter-tab" onclick="filterStudents(this,'pending')">待批改</button>
        <button class="filter-tab" onclick="filterStudents(this,'graded')">已批改</button>
      </div>
    </div>
    <div id="studentItems">
      <div style="text-align:center;padding:30px;color:#999;font-size:0.82rem">加载中…</div>
    </div>
  </div>

  <!-- Grade area -->
  <div class="grade-area" id="gradeArea">
    <div class="grade-empty" id="gradeEmpty">
      <div class="empty-icon"><i data-lucide="mouse-pointer-click"></i></div>
      <p>点击左侧学生查看批改面板</p>
    </div>
    <div id="gradePanel" style="display:none">
      <div class="grade-head">
        <div class="grade-student">
          <div class="grade-student-avatar" id="gradeAvatar">?</div>
          <div>
            <div class="grade-student-name" id="gradeName">—</div>
            <div class="grade-student-meta" id="gradeMeta"></div>
          </div>
        </div>
        <div class="grade-nav">
          <button onclick="navigateStudent(-1)"><i data-lucide="chevron-left" style="width:14px;height:14px"></i> 上一个</button>
          <button onclick="navigateStudent(1)">下一个 <i data-lucide="chevron-right" style="width:14px;height:14px"></i></button>
        </div>
      </div>

      <div class="file-preview" id="filePreview">
        <div class="file-icon"><i data-lucide="file-text"></i></div>
        <div class="file-name" id="fileName">—</div>
        <div class="file-meta" id="fileMeta">—</div>
      </div>

      <div class="score-section">
        <div class="score-box">
          <input type="number" placeholder="—" min="0" max="100" id="scoreInput">
          <div class="score-max">/ 100 分</div>
          <div class="quick-scores">
            <button class="quick-score" onclick="setScore(100)">100</button>
            <button class="quick-score" onclick="setScore(90)">90</button>
            <button class="quick-score" onclick="setScore(80)">80</button>
            <button class="quick-score" onclick="setScore(70)">70</button>
            <button class="quick-score" onclick="setScore(60)">60</button>
          </div>
        </div>
        <div class="comment-box">
          <label class="form-label">评语</label>
          <textarea class="form-textarea" id="commentInput" placeholder="给学生的反馈…" style="min-height:80px"></textarea>
          <div class="comment-quick">
            <button class="comment-chip" onclick="addComment('做得很好，继续保持！')"><i data-lucide="thumbs-up"></i> 做得好</button>
            <button class="comment-chip" onclick="addComment('格式不规范，请注意排版。')"><i data-lucide="ruler"></i> 格式问题</button>
            <button class="comment-chip" onclick="addComment('部分题目解答不完整，请补充。')"><i data-lucide="pencil"></i> 不够完整</button>
            <button class="comment-chip" onclick="addComment('思路清晰，代码实现良好。')"><i data-lucide="code-2"></i> 代码良好</button>
            <button class="comment-chip" onclick="addComment('迟交了，下次注意截止时间。')"><i data-lucide="clock"></i> 迟交提醒</button>
          </div>
        </div>
      </div>

      <div class="grade-actions">
        <button class="btn btn-primary" id="submitGradeBtn" onclick="submitGrade()">提交批改 →</button>
        <button class="btn btn-secondary" onclick="skipStudent()">跳过</button>
        <span class="spacer"></span>
        <span class="hint">快捷键：Ctrl+Enter 提交</span>
      </div>
    </div>
  </div>
</div>
</main></div>

<script src="../assets/js/lucide.js"></script>
<script src="../assets/js/shared.js"></script>
<script src="../assets/js/api.js"></script>
<script src="../assets/js/auth.js"></script>
<script src="submissions.js"></script>
</body></html>
