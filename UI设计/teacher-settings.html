<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>设置 · 教师控制台</title><link rel="icon" type="image/svg+xml" href="favicon.svg"><link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/base.css">
<link rel="stylesheet" href="assets/css/shared.css">
<link rel="stylesheet" href="assets/css/teacher-settings.css"></head><body>
<div class="app">
<aside class="sidebar" id="sidebar">
<div class="sidebar-logo"><span class="icon-box" style="background:var(--yellow)"><i data-lucide="pen-tool"></i></span> 作业提交</div>
<div class="sidebar-school">院校 A · 2026春季学期</div>
<div class="sidebar-role"><span class="role-tag" style="background:var(--sky)">教师</span> 教师工作台</div>
<div class="nav-section">教学管理</div>
<a class="side-link" href="dashboard-teacher.html"><span class="ico"><i data-lucide="bar-chart-3"></i></span> 控制台</a>
<a class="side-link" href="teacher-courses.html"><span class="ico"><i data-lucide="book-open"></i></span> 我的课程</a>
<a class="side-link" href="teacher-assign.html"><span class="ico"><i data-lucide="pen-tool"></i></span> 布置作业</a>
<a class="side-link" href="teacher-grade.html"><span class="ico"><i data-lucide="check-circle"></i></span> 批改作业 <span class="badge">23</span></a>
<a class="side-link" href="teacher-scores.html"><span class="ico"><i data-lucide="clipboard-list"></i></span> 成绩管理</a>
<div class="nav-section">其他</div>
<a class="side-link" href="teacher-messages.html"><span class="ico"><i data-lucide="message-circle"></i></span> 学生留言 <span class="badge">5</span></a>
<a class="side-link active" href="teacher-settings.html"><span class="ico"><i data-lucide="settings"></i></span> 设置</a>
<div class="sidebar-bottom"><div class="user-info"><div class="user-avatar" style="background:var(--lavender)"><i data-lucide="user"></i></div><div><div class="user-name">教师 001</div><div class="user-role">计算机科学与技术</div></div></div><button class="logout-btn" onclick="location.href='login.html'"><i data-lucide="log-out" style="width:16px;height:16px"></i> 退出登录</button></div>
</aside>
<main class="main">
<button class="mobile-menu-btn" onclick="document.getElementById('sidebar').classList.toggle('open')">☰</button>
<div class="topbar"><h1><i data-lucide="settings"></i> 个人设置</h1><button class="btn btn-primary">保存设置</button></div>

<div class="settings-grid anim">
<div class="setting-card">
<h3><i data-lucide="user"></i> 个人信息</h3>
<div class="form-group"><label class="form-label">姓名</label><input class="form-input" value="教师 001"></div>
<div class="form-group"><label class="form-label">工号</label><input class="form-input" value="T001" disabled style="background:#f5f3ed;color:#aaa"></div>
<div class="form-group"><label class="form-label">所属院系</label><input class="form-input" value="计算机科学与技术学院"></div>
<div class="form-group"><label class="form-label">邮箱</label><input class="form-input" value="teacher001@school.edu" type="email"></div>
</div>
<div class="setting-card">
<h3><i data-lucide="bell"></i> 通知偏好</h3>
<div class="setting-row"><div><div class="setting-label">新提交提醒</div><div class="setting-desc">有新作业提交时通知你</div></div><div class="toggle on" onclick="this.classList.toggle('on')"></div></div>
<div class="setting-row"><div><div class="setting-label">学生留言通知</div><div class="setting-desc">收到学生消息时提醒</div></div><div class="toggle on" onclick="this.classList.toggle('on')"></div></div>
<div class="setting-row"><div><div class="setting-label">截止提醒汇总</div><div class="setting-desc">每天汇总一次截止情况</div></div><div class="toggle" onclick="this.classList.toggle('on')"></div></div>
</div>
<div class="setting-card">
<h3><i data-lucide="lock"></i> 安全</h3>
<div class="form-group"><label class="form-label">修改密码</label><input class="form-input" type="password" placeholder="当前密码"></div>
<div class="form-group"><input class="form-input" type="password" placeholder="新密码"></div>
<div class="form-group"><input class="form-input" type="password" placeholder="确认新密码"></div>
<button class="btn btn-secondary">更新密码</button>
</div>
<div class="setting-card">
<h3><i data-lucide="palette"></i> 显示设置</h3>
<div class="setting-row"><div><div class="setting-label">默认课程视图</div></div><select class="form-select" style="width:120px"><option>列表视图</option><option>卡片视图</option></select></div>
<div class="setting-row"><div><div class="setting-label">每页显示条数</div></div><select class="form-select" style="width:80px"><option>20</option><option selected>50</option><option>100</option></select></div>
<div class="setting-row"><div><div class="setting-label">显示已批改标记</div></div><div class="toggle on" onclick="this.classList.toggle('on')"></div></div>
</div>
</div>
</main></div>
<script src="assets/js/lucide.js"></script>
<script src="assets/js/shared.js"></script>
</body></html>
